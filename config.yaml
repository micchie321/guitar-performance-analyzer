# ==========================================
# Guitar Performance Analyzer Configuration
# ==========================================

analysis:
  sr: 22050
  phrase_length_sec: 4.0   # Length of a single phrase window (e.g., 4.0 seconds)

cnn_logic:
  model_path: "models/guitar_3class_audiomentations.h5"
  active_audio_sec: 0.15   # Use 150ms of audio starting from the detected attack
  total_input_sec: 0.5     # Pad the remaining 350ms with zeros to match model input
  backtrack_sec: 0.02      # Backtrack 20ms from the peak to capture the exact transient

onset:
  fmin: 200                # Lower frequency bound for bandpass filtering (Hz)
  fmax: 8000               # Upper frequency bound for bandpass filtering (Hz)
  threshold: 0.3           # Sensitivity threshold for onset detection (after normalization)

timbre:
  n_mfcc: 13               # Number of MFCC (Mel-frequency cepstral coefficients) dimensions
  mid_scoop_low: 400       # Lower frequency bound for mid-scoop calculation (Hz)
  mid_scoop_high: 2000     # Upper frequency bound for mid-scoop calculation (Hz)